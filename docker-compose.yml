services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marshell
      POSTGRES_PASSWORD: marshell
      POSTGRES_DB: marshell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marshell -d marshell"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  network:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://marshell:marshell@postgres:5432/marshell?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PUBLIC_NETWORK_URL: http://localhost:8080
      LISTEN_ADDR: 0.0.0.0
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
